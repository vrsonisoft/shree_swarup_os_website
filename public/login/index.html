<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Login...</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Redirecting to ChowChak login portal...">
    <link rel="canonical" href="https://console.chowchak.com/login">
    <meta http-equiv="refresh" content="0; url=https://console.chowchak.com/login">
    <script>
        const isLocal = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1');
        const targetUrl = isLocal 
            ? 'http://127.0.0.1:8000/login' 
            : 'https://console.chowchak.com/login';
        window.location.replace(targetUrl);
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>

    <style>html, body, button, input, select, textarea { font-family: 'Outfit', sans-serif !important; }
    /* STANDARDIZED HEADER CONTAINER (MATCHES PAGE .wrap 1180px) */
    .menutiger-nav {
      padding-left: 0 !important;
      padding-right: 0 !important;
    }
    .menutiger-nav .header-inner-wrap,
    .menutiger-nav > div {
      max-width: 1180px !important;
      width: 100% !important;
      margin-left: auto !important;
      margin-right: auto !important;
      padding-left: 24px !important;
      padding-right: 24px !important;
      box-sizing: border-box !important;
    }
    .mobile-header-nav {
      height: 60px !important;
      display: flex !important;
      align-items: center !important;
      padding-left: 0 !important;
      padding-right: 0 !important;
      background-color: #ffffff !important;
      border-bottom: 1px solid #e5e7eb !important;
    }
    html.dark .mobile-header-nav {
      background-color: #111827 !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
    }
    .mobile-header-nav .header-inner-wrap,
    .mobile-header-nav > div {
      max-width: 1180px !important;
      width: 100% !important;
      height: 100% !important;
      margin-left: auto !important;
      margin-right: auto !important;
      padding-left: 18px !important;
      padding-right: 18px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      box-sizing: border-box !important;
    }
    .mobile-header-nav .logo-text {
      color: #2E6F40 !important;
      font-weight: 800 !important;
      font-size: 20px !important;
    }
    html.dark .mobile-header-nav .logo-text,
html.dark .menutiger-nav .logo-text {
  color: #2E6F40 !important;
}
    #theme-toggle-mobile,
    #mobile-menu-toggle {
      width: 38px !important;
      height: 38px !important;
      border-radius: 10px !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      border: 1px solid #e5e7eb !important;
      background: #f9fafb !important;
      color: #374151 !important;
      transition: all 0.2s ease !important;
    }
    #theme-toggle-mobile:hover,
    #mobile-menu-toggle:hover {
      background: #f3f4f6 !important;
      border-color: #d1d5db !important;
    }
    html.dark #theme-toggle-mobile,
    html.dark #mobile-menu-toggle {
      background: rgba(255, 255, 255, 0.06) !important;
      border-color: rgba(255, 255, 255, 0.12) !important;
      color: #f3f4f6 !important;
    }
    html.dark #theme-toggle-mobile:hover,
    html.dark #mobile-menu-toggle:hover {
      background: rgba(255, 255, 255, 0.12) !important;
      border-color: rgba(255, 255, 255, 0.2) !important;
    }

</style>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f9fafb; color: #374151;">
    <div style="text-align: center; padding: 24px; max-width: 420px; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
        <h2 style="font-size: 18px; margin-bottom: 8px; color: #111827;">Redirecting to Login Portal...</h2>
        <p style="font-size: 14px; color: #6b7280; margin-bottom: 16px;">If you are not redirected automatically, please click below:</p>
        <a id="redirect-link" href="https://console.chowchak.com/login" style="display: inline-block; background: #2E6F40; color: #ffffff; font-weight: 600; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-size: 14px;">Go to Login</a>
    </div>
    <script>
        document.getElementById('redirect-link').href = targetUrl;
    </script>
</body>
</html>
