<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Restaurant Signup...</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Redirecting to ShreeSwarupOS restaurant registration portal...">
    <link rel="canonical" href="https://shreeswarupos.vrsonisoft.com/restaurant-signup">
    <meta http-equiv="refresh" content="0; url=https://shreeswarupos.vrsonisoft.com/restaurant-signup">
    <script>
        const isLocal = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1');
        const targetUrl = isLocal 
            ? 'http://127.0.0.1:8000/restaurant-signup' 
            : 'https://shreeswarupos.vrsonisoft.com/restaurant-signup';
        window.location.replace(targetUrl);
    </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f9fafb; color: #374151;">
    <div style="text-align: center; padding: 24px; max-width: 420px; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
        <h2 style="font-size: 18px; margin-bottom: 8px; color: #111827;">Redirecting to Restaurant Registration...</h2>
        <p style="font-size: 14px; color: #6b7280; margin-bottom: 16px;">If you are not redirected automatically, please click below:</p>
        <a id="redirect-link" href="https://shreeswarupos.vrsonisoft.com/restaurant-signup" style="display: inline-block; background: #00B692; color: #ffffff; font-weight: 600; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-size: 14px;">Go to Signup</a>
    </div>
    <script>
        document.getElementById('redirect-link').href = targetUrl;
    </script>
</body>
</html>
